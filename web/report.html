    <script>
      // Apply the saved theme before the first paint, so the page doesn't flash.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("ghost-theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
