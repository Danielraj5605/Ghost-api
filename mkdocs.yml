site_name: Ghost API
site_description: Find a website's hidden API and get a typed, tested client for it.
repo_url: https://github.com/Danielraj5605/Ghost-api
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Danielraj
strict: true

theme:
  name: material
  custom_dir: overrides
  font: false  # system fonts: no request to Google Fonts (see privacy.md)
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

extra:
  generator: false  # no "Made with" credit in the footer

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: { base_path: ["."], check_paths: true }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - With Claude and other assistants: guide/assistants.md
      - Exploring a site: guide/exploring.md
      - Using the client: guide/clients.md
      - Data without code: guide/data.md
      - When the API changes: github-action.md
      - From Python: guide/python.md
  - Does it help? Measured: benchmark.md
  - "Gallery: real runs": gallery.md
  - Command reference: cli.md
  - Security and data: security.md
  - Changelog: changelog.md
  - Privacy policy: privacy.md
  - Terms and conditions: terms.md
