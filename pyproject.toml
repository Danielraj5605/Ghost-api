[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# "ghost-api" is taken on PyPI by another project; the command is still `ghost-api`.
name = "ghost-api-cli"
dynamic = ["version"]
description = "An AI agent that turns any website into a typed, tested API client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Danielraj" }]
keywords = [
    "api", "reverse-engineering", "api-client", "openapi", "code-generation", "playwright",
    "ai-agent", "llm", "web-scraping", "sdk-generator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "playwright>=1.45",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "genson>=1.3",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openpyxl>=3.1",
    "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]          # `ghost-api mcp`: sites as tools for AI assistants
notify = ["plyer>=2.1"]     # desktop notifications for `ghost-api watch`
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]  # the documentation site (mkdocs.yml)
dev = [
    "pytest>=8", "ruff>=0.6", "mypy>=1.11", "openapi-spec-validator>=0.7", "types-PyYAML",
    "psutil>=5.9", "types-psutil", "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Danielraj5605/Ghost-api"
Documentation = "https://danielraj5605.github.io/Ghost-api/"
Changelog = "https://github.com/Danielraj5605/Ghost-api/blob/main/CHANGELOG.md"
Issues = "https://github.com/Danielraj5605/Ghost-api/issues"
Security = "https://github.com/Danielraj5605/Ghost-api/blob/main/SECURITY.md"

[project.scripts]
ghost-api = "ghost_api.cli:entry"

[tool.setuptools.dynamic]
version = { attr = "ghost_api.__version__" }

[tool.setuptools.packages.find]
include = ["ghost_api*"]

[tool.setuptools.package-data]
ghost_api = ["py.typed", "integrations/claude_code/*/*.md",
             "integrations/claude_code/skills/*/*.md", "generator/templates/*.j2", "web/static/*", "web/static/assets/*", "export/viewer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Print stack traces if a test runs over 5 minutes, so a hang shows where it is stuck.
faulthandler_timeout = 300
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
