[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-api"
version = "0.1.0"
description = "An AI agent that turns any website into a typed, tested API client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "genson>=1.3",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openpyxl>=3.1",
    "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]          # `ghost-api mcp`: sites as tools for AI assistants
notify = ["plyer>=2.1"]     # desktop notifications for `ghost-api watch`
dev = [
    "pytest>=8", "ruff>=0.6", "mypy>=1.11", "openapi-spec-validator>=0.7", "types-PyYAML",
    "psutil>=5.9", "types-psutil",
]

[project.scripts]
ghost-api = "ghost_api.cli:app"

[tool.setuptools.packages.find]
include = ["ghost_api*"]

[tool.setuptools.package-data]
ghost_api = ["generator/templates/*.j2", "web/static/*", "web/static/assets/*", "export/viewer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Print stack traces if a test runs over 5 minutes, so a hang shows where it is stuck.
faulthandler_timeout = 300
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
