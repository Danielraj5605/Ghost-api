name: Live evaluation

# Real sites change on their own, so this runs on a schedule and never blocks a build.
# Needs an LLM key as a repository secret (GEMINI_API_KEY, GROQ_API_KEY or
# OPENROUTER_API_KEY); without one it runs the sites without the agent.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -e ".[dev]" -c requirements.lock
          python -m playwright install --with-deps chromium
      - name: Run every site (local corpus with the agent, and the live sites)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY$GROQ_API_KEY$OPENROUTER_API_KEY" ]; then flag="--no-agent"; fi
          python -m evals.run_eval --suite all $flag --results-dir eval-results || true
          cat eval-results/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: live-eval-${{ github.run_id }}
          path: eval-results/
