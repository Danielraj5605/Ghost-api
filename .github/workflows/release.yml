name: Release

# Runs only when a version tag is pushed, e.g.:  git tag v0.2.0 && git push origin v0.2.0
# Publishing uses PyPI "trusted publishing": no token is stored in GitHub. Set it up once at
# https://pypi.org/manage/account/publishing/ (project ghost-api-cli, workflow release.yml,
# environment pypi) before pushing the first tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag matches the package version
        run: |
          version="$(python -c 'import ghost_api; print(ghost_api.__version__)')"
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} but ghost_api.__version__ is $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install build
          python -m build
          python scripts/check_package.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \[" v "\]" {on=1; next} /^## \[/ {on=0} on' \
            CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Ghost API $version" \
            --notes-file notes.md
