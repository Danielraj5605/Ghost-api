name: Release

# Runs only when a version tag is pushed, e.g.:  git tag v0.2.0 && git push origin v0.2.0
# Publishing uses PyPI "trusted publishing": no token is stored in GitHub. Set it up once at
# https://pypi.org/manage/account/publishing/ (project ghost-api-cli, workflow release.yml,
# environment pypi) before pushing the first tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag matches the package version
        run: |
          version="$(python -c 'import ghost_api; print(ghost_api.__version__)')"
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} but ghost_api.__version__ is $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install build
          python -m build
          python scripts/check_package.py dist/*.whl
      - name: Software bill of materials (CycloneDX)
        run: |
          python -m pip install cyclonedx-bom dist/*.whl
          mkdir -p sbom  # not in dist/: PyPI only accepts distributions there
          cyclonedx-py environment --output-format JSON -o sbom/ghost-api-cli.sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing and signed provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Signed build provenance (verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: Publish to PyPI (the SBOM stays with the GitHub release)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
          attestations: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/
      - name: Create the GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' \
            CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* sbom/* --title "Ghost API $version" \
            --notes-file notes.md
